summary: An LFS system can be used without a graphical desktop, and unless or until
  you install a graphical environment you will have to work in the console. Most,
  if not all, PCs boot with an 8x16 font - whatever the actual screen size. There
  are a few things you can do to alter the display on the console. Most of them involve
  changing the font, but the first alters the commandline used by grub.
