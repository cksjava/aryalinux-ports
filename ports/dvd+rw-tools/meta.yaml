summary: The dvd+rw-tools package contains several utilities to master the DVD media,
  both +RW/+R and -R[W]. The principle tool is growisofs which provides a way to both
  lay down and grow an ISO9660 file system on (as well as to burn an arbitrary pre-mastered
  image to) all supported DVD media. This is useful for creating a new DVD or adding
  to an existing image on a partially burned DVD.
