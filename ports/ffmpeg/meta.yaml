summary: FFmpeg is a solution to record, convert and stream audio and video. It is
  a very fast video and audio converter and it can also acquire from a live audio/video
  source. Designed to be intuitive, the command-line interface (ffmpeg) tries to figure
  out all the parameters, when possible. FFmpeg can also convert from any sample rate
  to any other, and resize video on the fly with a high quality polyphas
