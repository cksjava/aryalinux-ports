summary: SANE is short for Scanner Access Now Easy. Scanner access, however, is far
  from easy, since every vendor has their own protocols. The only known protocol that
  should bring some unity into this chaos is the TWAIN interface, but this is too
  imprecise to allow a stable scanning framework. Therefore, SANE comes with its own
  protocol, and the vendor drivers can't be used.
