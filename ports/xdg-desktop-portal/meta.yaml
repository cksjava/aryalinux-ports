summary: 'xdg-desktop-portal is a D-Bus service that allows applications to interact
  with the desktop in a safe way. Several aspects of desktop interaction, like file
  chooser, desktop style, etc are implemented in different D-Bus APIs, known as portals.
  Sandboxed applications benefit the most from this service since they don''t need
  special permissions to use the portal APIs, but any application can use it. '
